<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jQuery Pseudoclass Implemetation</title>
  </head>
  <body>
    <ul id="destinations">
      <li>Bandung</li>
      <li>Jakarta</li>
      <ul>
        <li>Jakarta Pusat</li>
        <li>Jakarta Utara</li>
        <li>Jakarta Selatan</li>
        <li>Jakarta Barat</li>
        <li>Jakarta Timur</li>
      </ul>
      <li>Surabaya</li>
      <li>Bali</li>
    </ul>
    <button>Klik</button>

    <script src="jquery-3.7.1.min.js"></script>
    <script>
      $(document).ready(function () {
        $("button").click(function () {
            $("#destinations ul").css("background-color", "yellow");
        });
      });
    </script>
  </body>
</html>

<!-- $(#namaIdNya > li), logo > diartikan sebagai child -->
<!-- $(.namaClass, #namaId) tanda koma diartikan untuk kita yang ingin mencari lebih dari satu eleme -->
